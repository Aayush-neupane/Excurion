# Supabase project configuration.
# Docs: https://supabase.com/docs/reference/cli/config
project_id = "excurion"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[db.pooler]
enabled = false

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["https://excurion.netlify.app"]
jwt_expiry = 3600
enable_signup = true
email_confirmations = "off"